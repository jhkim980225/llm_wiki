apiVersion: v1
kind: Namespace
metadata:
  name: jh-wiki-graph
---
# ── Postgres ──────────────────────────────────────────────────────────
# longhorn(기본 스토리지클래스) 프로비저너가 죽어 있어 cephfs-sc를 명시한다.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: jh-wiki-graph
type: Opaque
stringData:
  POSTGRES_USER: wiki
  POSTGRES_PASSWORD: wiki-graph-2026
  POSTGRES_DB: wiki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: jh-wiki-graph
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs-sc
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jh-wiki-graph
spec:
  replicas: 1
  # RWO 볼륨은 롤링업데이트에서 Multi-Attach로 막힌다. 갈아끼우는 방식으로 둔다.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          # 의미검색용 pgvector 포함. postgres:16-alpine에서 교체 시 libc(musl→glibc)
          # 콜레이션이 달라져 최초 기동 후 REFRESH COLLATION VERSION + REINDEX 1회 필요.
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef: { name: postgres }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "wiki"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jh-wiki-graph
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# ── 앱 ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-graph-env
  namespace: jh-wiki-graph
data:
  DATABASE_URL: postgres://wiki:wiki-graph-2026@postgres:5432/wiki
  # 온톨로지 소스 — 파드가 도는 노드에서 NodePort로 붙는다.
  ONTOLOGY_EJKIM_URL: http://192.168.0.114:30303
  ONTOLOGY_KAKAO_URL: http://192.168.0.114:30301
  ONTOLOGY_SEUNGHOON_URL: http://192.168.0.100:30310
  FUSEKI_URL: http://192.168.0.100:31406
  FUSEKI_DATASET: ds
  # kakao는 SPARQL 직조회 대신 전용 RAG API를 쓴다 (AI 작성 근거)
  KAKAO_RAG_URL: http://192.168.0.114:30309/kakao/api/rag/ask
  EJKIM_RAG_URL: http://192.168.0.113:30311/ejkim/api/rag/ask
  SEUNGHOON_RAG_URL: http://192.168.0.113:30313/api/rag/ask
  # LLM은 채팅·AI 작성에서만 쓴다. 적재 경로는 LLM을 타지 않는다.
  # openai 백엔드 — API 키는 configmap이 아니라 wiki-graph-llm Secret에 있다
  # (클러스터에 직접 생성, git에 남기지 않는다):
  #   kubectl -n jh-wiki-graph create secret generic wiki-graph-llm --from-literal=LLM_API_KEY=sk-...
  # vLLM으로 되돌리려면: LLM_BACKEND: vllm / LLM_BASE_URL: http://192.168.10.7/v1 / LLM_MODEL: qwen3-32b-finance
  LLM_BACKEND: openai
  LLM_MODEL: gpt-5.6-luna
  # 의미검색 임베딩 백엔드 (사내 Ollama, embeddinggemma 768차원)
  EMBED_URL: http://192.168.0.152:11434
  EMBED_MODEL: embeddinggemma
  # FLOW 스케줄 tick 보호 토큰 — 아래 CronJob이 같은 값을 헤더로 보낸다.
  # 사내망 전용 데모라 configmap에 둔다. 외부 노출 강화 시 Secret으로 승격.
  FLOW_TICK_TOKEN: flow-tick-sj-2026-8f3a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-graph
  namespace: jh-wiki-graph
spec:
  replicas: 1
  selector:
    matchLabels: { app: wiki-graph }
  template:
    metadata:
      labels: { app: wiki-graph }
    spec:
      # 레지스트리가 없다. 이미지를 fedaworker01 containerd에 직접 넣었으므로
      # 그 노드에 고정하고 pull을 막는다.
      nodeSelector:
        kubernetes.io/hostname: fedaworker01
      initContainers:
        - name: migrate
          # 앱 이미지의 node_modules는 Next standalone이 추려낸 것이라 Prisma CLI의
          # 전이 의존성이 없다. 마이그레이션은 CLI를 갖춘 전용 이미지로 돌린다.
          image: wiki-graph-migrate:0.11.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: wiki-graph-env }
      containers:
        - name: app
          image: wiki-graph:0.41.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: wiki-graph-env }
            # LLM API 키. optional — 없으면 뜨긴 뜨되 채팅만 안 된다 (vLLM 복귀 시에도 안전)
            - secretRef: { name: wiki-graph-llm, optional: true }
          env:
            # ejkim 전량 적재(13.8만 개체·141만 트리플)가 기본 힙(~1GB)을 넘어 OOM —
            # 실측 2026-08-07 exit 139. 컨테이너 한도(4Gi) 안에서 힙을 넉넉히 준다.
            - name: NODE_OPTIONS
              value: --max-old-space-size=3072
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            # 인증 게이트 밖의 전용 헬스 경로 — /api/ontology는 이제 401이라 못 쓴다
            # basePath(/graphwiki) 적용 후 경로. next.config.ts와 연동.
            httpGet: { path: /graphwiki/api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-graph
  namespace: jh-wiki-graph
spec:
  type: NodePort
  selector: { app: wiki-graph }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31900
---
# 외부(비VPN) 접근 — 사내 ingress-nginx(LB 192.168.10.27, 공인 1.201.66.21 포워딩) 경유.
# DNS에 wiki.fedaground.com A 레코드가 있어야 열린다 (posthog/admin 서브도메인과 같은 패턴).
# TLS는 cert-manager letsencrypt-prod가 DNS 생기면 자동 발급한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-graph-ingress
  namespace: jh-wiki-graph
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    # LLM 스트리밍(채팅·AI 작성)이 수 분짜리라 프록시 타임아웃을 늘린다
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: wiki.fedaground.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiki-graph
                port: { number: 3000 }
  tls:
    - hosts: [wiki.fedaground.com]
      secretName: wiki-fedaground-tls
---
# 회사 표준 경로 방식 — cloud.fedaground.com/graphwiki (다른 팀 앱들과 같은 호스트).
# 앱이 basePath(/graphwiki)로 빌드되므로 리라이트 없이 경로 그대로 넘긴다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-graph-ingress-cloud
  namespace: jh-wiki-graph
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: cloud.fedaground.com
      http:
        paths:
          - path: /graphwiki
            pathType: Prefix
            backend:
              service:
                name: wiki-graph
                port: { number: 3000 }
  tls:
    - hosts: [cloud.fedaground.com]
      secretName: wiki-graph-cloud-tls
---
# DNS 콘솔 없이 쓰는 IP 기반 외부 주소 — nip.io 공용 와일드카드 DNS가
# wiki.1.201.66.21.nip.io 를 공인 IP로 풀어 준다. 인증서 없이 http만 (ssl-redirect 끔).
# wiki.fedaground.com DNS가 생기면 이 인그레스는 지워도 된다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-graph-ingress-ip
  namespace: jh-wiki-graph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: wiki.1.201.66.21.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiki-graph
                port: { number: 3000 }
---
# FLOW 스케줄 심장박동 — 10분마다 due 작업을 실행한다. 앱 재시작과 무관.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-graph-flow-tick
  namespace: jh-wiki-graph
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 660
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: curlimages/curl:8.10.1
              args:
                - -sS
                - -X
                - POST
                - -H
                - "x-flow-token: flow-tick-sj-2026-8f3a"
                - --max-time
                - "600"
                - http://wiki-graph.jh-wiki-graph.svc.cluster.local:3000/graphwiki/api/flow/tick
