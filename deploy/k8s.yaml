apiVersion: v1
kind: Namespace
metadata:
  name: jh-wiki-graph
---
# ── Postgres ──────────────────────────────────────────────────────────
# longhorn(기본 스토리지클래스) 프로비저너가 죽어 있어 cephfs-sc를 명시한다.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: jh-wiki-graph
type: Opaque
stringData:
  POSTGRES_USER: wiki
  POSTGRES_PASSWORD: wiki-graph-2026
  POSTGRES_DB: wiki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: jh-wiki-graph
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs-sc
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jh-wiki-graph
spec:
  replicas: 1
  # RWO 볼륨은 롤링업데이트에서 Multi-Attach로 막힌다. 갈아끼우는 방식으로 둔다.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          # 의미검색용 pgvector 포함. postgres:16-alpine에서 교체 시 libc(musl→glibc)
          # 콜레이션이 달라져 최초 기동 후 REFRESH COLLATION VERSION + REINDEX 1회 필요.
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef: { name: postgres }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "wiki"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jh-wiki-graph
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# ── 앱 ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-graph-env
  namespace: jh-wiki-graph
data:
  DATABASE_URL: postgres://wiki:wiki-graph-2026@postgres:5432/wiki
  # 온톨로지 소스 — 파드가 도는 노드에서 NodePort로 붙는다.
  ONTOLOGY_EJKIM_URL: http://192.168.0.114:30303
  ONTOLOGY_KAKAO_URL: http://192.168.0.114:30301
  ONTOLOGY_SEUNGHOON_URL: http://192.168.0.100:30310
  FUSEKI_URL: http://192.168.0.100:31406
  FUSEKI_DATASET: ds
  # kakao는 SPARQL 직조회 대신 전용 RAG API를 쓴다 (AI 작성 근거)
  KAKAO_RAG_URL: http://192.168.0.114:30309/kakao/api/rag/ask
  EJKIM_RAG_URL: http://192.168.0.113:30311/ejkim/api/rag/ask
  SEUNGHOON_RAG_URL: http://192.168.0.113:30313/api/rag/ask
  # LLM은 채팅·AI 작성에서만 쓴다. 적재 경로는 LLM을 타지 않는다.
  # openai 백엔드 — API 키는 configmap이 아니라 wiki-graph-llm Secret에 있다
  # (클러스터에 직접 생성, git에 남기지 않는다):
  #   kubectl -n jh-wiki-graph create secret generic wiki-graph-llm --from-literal=LLM_API_KEY=sk-...
  # vLLM으로 되돌리려면: LLM_BACKEND: vllm / LLM_BASE_URL: http://192.168.10.7/v1 / LLM_MODEL: qwen3-32b-finance
  LLM_BACKEND: openai
  LLM_MODEL: gpt-5.6-luna
  # 의미검색 임베딩 백엔드 (사내 Ollama, embeddinggemma 768차원)
  EMBED_URL: http://192.168.0.152:11434
  EMBED_MODEL: embeddinggemma
  # FLOW 스케줄 tick 보호 토큰 — 아래 CronJob이 같은 값을 헤더로 보낸다.
  # 사내망 전용 데모라 configmap에 둔다. 외부 노출 강화 시 Secret으로 승격.
  FLOW_TICK_TOKEN: flow-tick-sj-2026-8f3a
  # 본문 ```plantuml 펜스 렌더 서버 (아래 plantuml Deployment)
  PLANTUML_URL: http://plantuml:8080
  # LightRAG PoC (아래 lightrag Deployment) — /lightrag 테스트 화면의 프록시 대상
  LIGHTRAG_URL: http://lightrag:9621
  LIGHTRAG_API_KEY: lightrag-poc-sj-2026
  # 세션 쿠키에 Secure를 붙인다. TLS 인그레스(cloud.fedaground.com)로만 접속하는 전제다 —
  # 평문 http로 들어오면 브라우저가 쿠키를 버려 로그인이 무한 루프가 된다(cookies.ts 주석 참조).
  # 그래서 평문 인그레스(wiki-graph-ingress-ip)를 함께 제거했다. NodePort 31900도 로그인은 안 된다.
  COOKIE_SECURE: "1"
---
# ── PlantUML 렌더 서버 ────────────────────────────────────────────────
# 본문 ```plantuml 펜스를 SVG로 그린다. 공개 이미지라 노드가 직접 pull한다
# (앱 이미지처럼 ctr 반입 불필요). 상태 없음 — 볼륨 없음.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plantuml
  namespace: jh-wiki-graph
spec:
  replicas: 1
  selector:
    matchLabels: { app: plantuml }
  template:
    metadata:
      labels: { app: plantuml }
    spec:
      containers:
        - name: plantuml
          image: plantuml/plantuml-server:jetty
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: plantuml
  namespace: jh-wiki-graph
spec:
  selector: { app: plantuml }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# ── LightRAG PoC ──────────────────────────────────────────────────────
# 그래프 추출형 RAG 구경용 (docs/light-rag/).
# LLM은 LUNA(gpt-5.6-luna, wiki-graph-llm Secret 재사용), 임베딩은 사내 Ollama.
# 사용량 상한: 시드 2건·6천자 절단(scripts/lightrag-seed.py) + MAX_ASYNC_LLM=2.
# 저장은 emptyDir — 재시작 시 재색인이 PVC보다 싸다(2건). 제거 = 이 블록 삭제.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightrag
  namespace: jh-wiki-graph
spec:
  replicas: 1
  selector:
    matchLabels: { app: lightrag }
  template:
    metadata:
      labels: { app: lightrag }
    spec:
      containers:
        - name: lightrag
          image: ghcr.io/hkuds/lightrag:latest
          ports: [{ containerPort: 9621 }]
          env:
            - { name: LLM_BINDING, value: openai }
            - { name: LLM_BINDING_HOST, value: "https://api.openai.com/v1" }
            - { name: LLM_MODEL, value: gpt-5.6-luna }
            - name: LLM_BINDING_API_KEY
              valueFrom:
                secretKeyRef: { name: wiki-graph-llm, key: LLM_API_KEY }
            - { name: EMBEDDING_BINDING, value: ollama }
            - { name: EMBEDDING_BINDING_HOST, value: "http://192.168.0.152:11434" }
            - { name: EMBEDDING_MODEL, value: embeddinggemma }
            - { name: EMBEDDING_DIM, value: "768" }
            # 2026-08-29: 미설정 시 기본값(English)이라 한국어 원문에서도 개체가
            # 영어로 뽑혔다(Seongjin 등). 재배포 = emptyDir이라 기존 색인 소실 —
            # 재배포 후 전량 재색인 필요.
            - { name: SUMMARY_LANGUAGE, value: Korean }
            - { name: MAX_ASYNC_LLM, value: "2" }
            - { name: MAX_PARALLEL_INSERT, value: "1" }
            # 사내망 NodePort 노출이라 키만 건다. X-API-Key 헤더.
            - { name: LIGHTRAG_API_KEY, value: lightrag-poc-sj-2026 }
            - { name: WORKING_DIR, value: /data }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 9621 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lightrag
  namespace: jh-wiki-graph
spec:
  type: NodePort
  selector: { app: lightrag }
  ports:
    - port: 9621
      targetPort: 9621
      nodePort: 31930
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-graph
  namespace: jh-wiki-graph
spec:
  replicas: 1
  selector:
    matchLabels: { app: wiki-graph }
  template:
    metadata:
      labels: { app: wiki-graph }
    spec:
      # 레지스트리가 없다. 이미지를 fedaworker01 containerd에 직접 넣었으므로
      # 그 노드에 고정하고 pull을 막는다.
      nodeSelector:
        kubernetes.io/hostname: fedaworker01
      initContainers:
        - name: migrate
          # 앱 이미지의 node_modules는 Next standalone이 추려낸 것이라 Prisma CLI의
          # 전이 의존성이 없다. 마이그레이션은 CLI를 갖춘 전용 이미지로 돌린다.
          image: wiki-graph-migrate:0.61.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: wiki-graph-env }
      containers:
        - name: app
          image: wiki-graph:0.71.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: wiki-graph-env }
            # LLM API 키. optional — 없으면 뜨긴 뜨되 채팅만 안 된다 (vLLM 복귀 시에도 안전)
            - secretRef: { name: wiki-graph-llm, optional: true }
            # 세션 서명키. 없으면 session.ts의 하드코딩 기본값으로 서명해 토큰 위조가 가능해진다.
            # git에 남기지 않으려고 클러스터에서 직접 만든다:
            #   kubectl -n jh-wiki-graph create secret generic wiki-graph-auth \
            #     --from-literal=AUTH_SECRET="$(openssl rand -base64 48)"
            # 값을 바꾸면 기존 세션이 전부 무효가 된다(전원 재로그인).
            - secretRef: { name: wiki-graph-auth }
          env:
            # ejkim 전량 적재(13.8만 개체·141만 트리플)가 기본 힙(~1GB)을 넘어 OOM —
            # 실측 2026-08-07 exit 139. 컨테이너 한도(4Gi) 안에서 힙을 넉넉히 준다.
            - name: NODE_OPTIONS
              value: --max-old-space-size=3072
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            # 인증 게이트 밖의 전용 헬스 경로 — /api/ontology는 이제 401이라 못 쓴다
            # basePath(/graphwiki) 적용 후 경로. next.config.ts와 연동.
            httpGet: { path: /graphwiki/api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-graph
  namespace: jh-wiki-graph
spec:
  type: NodePort
  selector: { app: wiki-graph }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31900
---
# 외부(비VPN) 접근 — 사내 ingress-nginx(LB 192.168.10.27, 공인 1.201.66.21 포워딩) 경유.
# DNS에 wiki.fedaground.com A 레코드가 있어야 열린다 (posthog/admin 서브도메인과 같은 패턴).
# TLS는 cert-manager letsencrypt-prod가 DNS 생기면 자동 발급한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-graph-ingress
  namespace: jh-wiki-graph
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    # LLM 스트리밍(채팅·AI 작성)이 수 분짜리라 프록시 타임아웃을 늘린다
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: wiki.fedaground.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiki-graph
                port: { number: 3000 }
  tls:
    - hosts: [wiki.fedaground.com]
      secretName: wiki-fedaground-tls
---
# 회사 표준 경로 방식 — cloud.fedaground.com/graphwiki (다른 팀 앱들과 같은 호스트).
# 앱이 basePath(/graphwiki)로 빌드되므로 리라이트 없이 경로 그대로 넘긴다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-graph-ingress-cloud
  namespace: jh-wiki-graph
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: cloud.fedaground.com
      http:
        paths:
          - path: /graphwiki
            pathType: Prefix
            backend:
              service:
                name: wiki-graph
                port: { number: 3000 }
  tls:
    - hosts: [cloud.fedaground.com]
      secretName: wiki-graph-cloud-tls
---
# 평문 HTTP 인그레스(wiki.1.201.66.21.nip.io)는 2026-08-10 점검에서 제거했다.
# TLS 없이 공인망에 열려 있어 세션 쿠키가 평문으로 오갔다(docs/점검.md H-1).
# 접속은 위 두 TLS 인그레스로만 한다. 되살릴 일이 생기면 COOKIE_SECURE=1과 양립하지
# 않는다는 점을 먼저 확인할 것 — Secure 쿠키는 http로 오가지 않아 로그인이 안 된다.
---
# FLOW 스케줄 심장박동 — 10분마다 due 작업을 실행한다. 앱 재시작과 무관.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-graph-flow-tick
  namespace: jh-wiki-graph
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 660
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: curlimages/curl:8.10.1
              args:
                - -sS
                - -X
                - POST
                - -H
                - "x-flow-token: flow-tick-sj-2026-8f3a"
                - --max-time
                - "600"
                - http://wiki-graph.jh-wiki-graph.svc.cluster.local:3000/graphwiki/api/flow/tick
